name: iOS unsigned compile

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Simulator debug and device release
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: "true"
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      DART_SUPPRESS_ANALYTICS: "true"
      COCOAPODS_DISABLE_STATS: "true"
      FLUTTER_VERSION: 3.38.10
      FLUTTER_REVISION: c6f67dede3d4aa1aa7a69dd56a3494a5cde6cc80
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Record toolchain and resolve dependencies
        shell: bash
        run: |
          mkdir -p build/ios-checks
          sw_vers | tee build/ios-checks/macos.log
          xcodebuild -version | tee build/ios-checks/xcode.log
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.2"
          pod --version | tee build/ios-checks/cocoapods.log
          flutter --version --machine > build/ios-checks/flutter.json
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get --enforce-lockfile

      - name: Compile unsigned simulator debug app
        shell: bash
        run: |
          flutter build ios --simulator --debug --no-codesign --no-pub 2>&1 | tee build/ios-checks/simulator.log
          test -d build/ios/iphonesimulator/Runner.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphonesimulator/Runner.app/Info.plist)" = "com.bting.audio"

      - name: Compile unsigned device release app
        shell: bash
        run: |
          flutter build ios --release --no-codesign --no-pub 2>&1 | tee build/ios-checks/device.log
          test -d build/ios/iphoneos/Runner.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist)" = "com.bting.audio"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' build/ios/iphoneos/Runner.app/Info.plist)" = "15.0"

      - name: Save compile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-compile-evidence-${{ github.run_id }}
          path: |
            build/ios-checks/
            ios/Podfile.lock
          retention-days: 7
          if-no-files-found: warn
